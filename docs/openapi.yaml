openapi: 3.0.3

info:
  title: HIS CAC API
  version: 1.0.0
  description: >
    Documentation officielle de l’API du Système d’Information Hospitalier CAC.
    Le workflow patient utilise le numero_fiche comme identifiant principal du passage,
    tandis que numero_patient identifie la personne de manière permanente.

servers:
  - url: /api
    description: API locale via proxy frontend
  - url: https://hopital.congoastral-app.com/api
    description: API production

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: Auth
  - name: Patients
  - name: Fiches
  - name: Receptions
  - name: Triage
  - name: Consultations
  - name: Laboratoire
  - name: Imagerie
  - name: Pharmacie
  - name: Stock pharmacie
  - name: Caisse
  - name: Facturation
  - name: Sorties
  - name: Agents CAC
  - name: Services catalog
  - name: Users
  - name: Audit
  - name: Notifications
  - name: Administration
  - name: Status Socket

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Utilisateur connecté
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /patients:
    get:
      tags: [Patients]
      summary: Liste des patients
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          schema:
            type: string
          description: Recherche par nom, numéro patient, numéro fiche ou téléphone.
        - name: numero_fiche
          in: query
          schema:
            type: string
          description: Recherche directe par numéro de fiche.
      responses:
        '200':
          description: Patients récupérés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListResponse'

    post:
      tags: [Patients]
      summary: Créer un patient ou une fiche patient
      description: >
        Crée un patient et/ou une fiche de passage.
        numero_patient identifie la personne.
        numero_fiche identifie le passage courant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreateRequest'
      responses:
        '201':
          description: Patient créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /patients/{id}:
    get:
      tags: [Patients]
      summary: Détail patient
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Patient récupéré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Patients]
      summary: Modifier patient
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreateRequest'
      responses:
        '200':
          description: Patient modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'

    delete:
      tags: [Patients]
      summary: Désactiver patient
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Patient désactivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /patients/fiche/{numeroFiche}:
    get:
      tags: [Fiches]
      summary: Rechercher une fiche patient par numero_fiche
      parameters:
        - name: numeroFiche
          in: path
          required: true
          schema:
            type: string
          example: FIC-000120
      responses:
        '200':
          description: Fiche récupérée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicheResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /fiches/{numeroFiche}/timeline:
    get:
      tags: [Fiches]
      summary: Timeline complète d’une fiche patient
      parameters:
        - name: numeroFiche
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Timeline de la fiche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicheTimelineResponse'

  /receptions:
    get:
      tags: [Receptions]
      summary: Liste des réceptions
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Réceptions récupérées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionListResponse'

    post:
      tags: [Receptions]
      summary: Créer une réception
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceptionRequest'
      responses:
        '201':
          description: Réception créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionResponse'

  /receptions/{id}:
    get:
      tags: [Receptions]
      summary: Détail réception
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Réception récupérée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionResponse'

    put:
      tags: [Receptions]
      summary: Modifier réception
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceptionRequest'
      responses:
        '200':
          description: Réception modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionResponse'

    delete:
      tags: [Receptions]
      summary: Supprimer réception
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Réception supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /receptions/{id}/payment:
    post:
      tags: [Receptions]
      summary: Valider paiement réception
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Paiement réception validé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionResponse'

  /triage:
    get:
      tags: [Triage]
      summary: Liste triage
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Triage récupéré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageListResponse'

    post:
      tags: [Triage]
      summary: Créer triage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequest'
      responses:
        '201':
          description: Triage créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageResponse'

  /triage/{id}:
    get:
      tags: [Triage]
      summary: Détail triage
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Triage récupéré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageResponse'

    put:
      tags: [Triage]
      summary: Modifier triage
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequest'
      responses:
        '200':
          description: Triage modifié
          content:
            application/json:
              schema:
