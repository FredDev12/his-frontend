  /consultations/{id}:
    get:
      tags: [Consultations]
      summary: Détail consultation
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Consultation récupérée
          content:
            application/json:
              schema:
