      tags: [Caisse]
      summary: Liste paiements
      responses:
        '200':
          description: Paiements récupérés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListResponse'

    post:
      tags: [Caisse]
      summary: Créer paiement caisse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaiementRequest'
      responses:
