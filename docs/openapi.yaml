    delete:
      tags: [Consultations]
      summary: Supprimer consultation
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Consultation supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /laboratoire:
    get:
      tags: [Laboratoire]
      summary: Liste demandes laboratoire
