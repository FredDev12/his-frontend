    post:
      tags: [Facturation]
      summary: Créer facture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactureRequest'
      responses:
        '201':
          description: Facture créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

  /factures/{id}/issue:
    post:
      tags: [Facturation]
      summary: Émettre facture
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Facture émise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

  /factures/{id}/cancel:
    post:
      tags: [Facturation]
      summary: Annuler facture
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Facture annulée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

  /sorties:
    get:
      tags: [Sorties]
      summary: Liste sorties patient
      responses:
        '200':
          description: Sorties récupérées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListResponse'

    post:
      tags: [Sorties]
      summary: Créer sortie patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SortieRequest'
      responses:
        '201':
          description: Sortie créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

  /sorties/{id}:
    get:
      tags: [Sorties]
      summary: Détail sortie
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Sortie récupérée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

    patch:
      tags: [Sorties]
      summary: Modifier, valider ou annuler sortie
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Sortie mise à jour
          content:
            application/json:
              schema:
