              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

  /paiements/{id}:
    get:
      tags: [Caisse]
      summary: Détail paiement
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Paiement récupéré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

    patch:
      tags: [Caisse]
      summary: Modifier, valider ou annuler paiement
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaiementRequest'
      responses:
        '200':
          description: Paiement mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

    delete:
      tags: [Caisse]
      summary: Supprimer paiement
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Paiement supprimé
          content:
            application/json:
              schema:
