    post:
      tags: [Imagerie]
      summary: Créer demande imagerie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagerieRequest'
      responses:
        '201':
          description: Demande imagerie créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

  /imagerie/{id}:
    get:
      tags: [Imagerie]
      summary: Détail demande imagerie
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Demande imagerie récupérée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

    put:
      tags: [Imagerie]
      summary: Modifier demande imagerie
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagerieRequest'
      responses:
        '200':
          description: Demande imagerie modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

    delete:
      tags: [Imagerie]
      summary: Supprimer demande imagerie
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Demande imagerie supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /pharmacie:
    get:
      tags: [Pharmacie]
      summary: Liste prescriptions pharmacie
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Prescriptions récupérées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListResponse'

    post:
      tags: [Pharmacie]
      summary: Créer prescription pharmacie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PharmacieRequest'
      responses:
        '201':
          description: Prescription créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

  /pharmacie/{id}:
    get:
      tags: [Pharmacie]
      summary: Détail prescription pharmacie
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Prescription récupérée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

    patch:
      tags: [Pharmacie]
      summary: Modifier ou délivrer prescription pharmacie
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PharmacieRequest'
      responses:
        '200':
          description: Prescription modifiée ou délivrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

    delete:
      tags: [Pharmacie]
      summary: Supprimer prescription pharmacie
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Prescription supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /pharmacie/stock:
    get:
      tags: [Stock pharmacie]
      summary: Liste produits stock pharmacie
      responses:
        '200':
          description: Stock récupéré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListResponse'

    post:
      tags: [Stock pharmacie]
      summary: Créer produit stock pharmacie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockProductRequest'
      responses:
        '201':
          description: Produit créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

  /pharmacie/stock/{id}/movements:
    post:
      tags: [Stock pharmacie]
      summary: Créer mouvement de stock
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
      responses:
        '200':
          description: Mouvement enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSingleResponse'

  /paiements:
